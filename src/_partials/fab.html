<!-- スマホのときだけ出る、右上の追従メニュー（カセットの形。スクロールでリールが回る）。
     押すと裏返って丸い閉じるボタンになり、画面いっぱいのメニューが開く。
     閉じるたびにカセットが A面 ↔ B面 に入れ替わる（ラベルの色が変わる。動きは casse.js） -->
<div class="fab" data-fab data-side="a">
  <button class="fab-btn" type="button" data-cta="fab_toggle" aria-expanded="false" aria-controls="fab-menu" aria-label="{{page.fabOpen}}" data-open-label="{{page.fabOpen}}" data-close-label="{{page.fabClose}}">
    <span class="fab-flip" aria-hidden="true">
      <span class="fab-face fab-front">
        <svg width="76" height="52" viewBox="0 0 76 52">
          <rect x="1" y="1" width="74" height="50" rx="6" fill="#000"/>
          <rect class="cs-label" x="8" y="7" width="60" height="27" rx="3"/>
          <rect class="cs-stripe" x="8" y="7" width="60" height="4"/>
          <rect x="19" y="14" width="38" height="14" rx="7" fill="#000"/>
          <g class="reel" style="transform-origin:28px 21px"><circle cx="28" cy="21" r="5" fill="#fff"/><path d="M28 17v8M24 21h8" stroke="#000" stroke-width="1.5"/></g>
          <g class="reel" style="transform-origin:48px 21px"><circle cx="48" cy="21" r="5" fill="#fff"/><path d="M48 17v8M44 21h8" stroke="#000" stroke-width="1.5"/></g>
          <text class="cs-side" x="13.5" y="25" text-anchor="middle" font-family="Jost, sans-serif" font-size="8" font-weight="600">A</text>
          <path d="M18 51l4-10h32l4 10" fill="none" stroke="#fff" stroke-width="1.5"/>
          <text x="38" y="49" text-anchor="middle" fill="#fff" font-family="Jost, sans-serif" font-size="7.5" font-weight="500" letter-spacing=".8">menu</text>
        </svg>
      </span>
      <span class="fab-face fab-back"><span class="fab-x"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span></span>
    </span>
  </button>
  <div class="fab-sheet" id="fab-menu" hidden>
    <p class="fab-title" lang="en">MENU</p>
    <nav class="fab-menu" aria-label="{{page.navLabel}}">
      {{{page.navFab}}}
    </nav>
    <p class="fab-ig"><a class="btn btn-line" href="{{ig}}" target="_blank" rel="noopener" lang="en"><svg class="ico" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg>Instagram</a></p>
    <div class="fab-lang">{{{page.langSwitch}}}</div>
  </div>
</div>
