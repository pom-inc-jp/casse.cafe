---
{ "cafeJsonLd": true }
---
{{> home-hero}}

<!-- メディア掲載の帯と、いちばん下のお知らせは日本語のトップだけ -->
<section class="media-band" aria-labelledby="media-h">
  <div class="wrap media-in">
    <h2 id="media-h">メディア掲載</h2>
    <div class="marquee">
      {{{media.track}}}
    </div>
  </div>
</section>

{{> home-body}}

<!-- 撮影・取材のご依頼への入口（日本語のトップだけ。くわしくは /shooting/） -->
<section class="sec wrap" id="shooting" aria-labelledby="shooting-h">
  <div class="indent shoot-band">
    <div>
      <h2 id="shooting-h">撮影・取材のご依頼</h2>
      <p class="small-text">営業時間外の店内を、雑誌やルック、映像の撮影にお貸ししています。テレビや雑誌、WEBメディアの取材も受け付けています。</p>
    </div>
    <p class="btns"><a class="btn btn-deep" href="/shooting/#shoot"><svg class="ico" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.8l1.6-2.2h6.2L16.7 7h2.8A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="3.6"/></svg>撮影について<span class="arrow" aria-hidden="true">→</span></a><a class="btn btn-purple" href="/shooting/#press"><svg class="ico" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>取材について<span class="arrow" aria-hidden="true">→</span></a></p>
  </div>
</section>

<section class="sec wrap" id="news">
  <div class="indent">
    <span class="bar" aria-hidden="true"></span>
    <h2 class="news-h">お知らせ</h2>
    <div class="filters" role="group" aria-label="カテゴリで絞り込む" data-target="news-latest">
      {{{news.filters}}}
    </div>
    {{{news.latest}}}
    <p class="empty" data-empty="news-latest" hidden>このカテゴリのお知らせはまだありません。</p>
    <p class="news-more"><a class="more" href="/news/">お知らせ一覧を見る</a></p>
  </div>
</section>
