---
{ "cafeJsonLd": true }
---
{{> home-hero}}

<!-- ここから2つ（メディア掲載・お知らせ）は日本語のトップだけ -->
<section class="media-band" aria-labelledby="media-h">
  <div class="wrap media-in">
    <h2 id="media-h">メディア掲載</h2>
    <div class="marquee">
      {{{media.track}}}
    </div>
  </div>
</section>

<section class="sec wrap" id="news">
  <div class="indent">
    <div class="sec-head">
      <div><span class="bar" aria-hidden="true"></span><h2>お知らせ</h2></div>
      <a class="more" href="/news/">一覧を見る</a>
    </div>
    <div class="filters" role="group" aria-label="カテゴリで絞り込む" data-target="news-latest">
      {{{news.filters}}}
    </div>
    {{{news.latest}}}
    <p class="empty" data-empty="news-latest" hidden>このカテゴリのお知らせはまだありません。</p>
  </div>
</section>

{{> home-body}}
