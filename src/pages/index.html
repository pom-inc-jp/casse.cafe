---
{ "cafeJsonLd": true }
---
{{> home-hero}}

<!-- メディア掲載の帯と、いちばん下のお知らせは日本語のトップだけ -->
<section class="media-band" aria-labelledby="media-h">
  <div class="wrap media-in">
    <h2 id="media-h">メディア掲載</h2>
    <div class="marquee">
      {{{media.track}}}
    </div>
  </div>
</section>

{{> home-body}}

<section class="sec wrap" id="news">
  <div class="indent">
    <span class="bar" aria-hidden="true"></span>
    <h2 class="news-h">お知らせ</h2>
    <div class="filters" role="group" aria-label="カテゴリで絞り込む" data-target="news-latest">
      {{{news.filters}}}
    </div>
    {{{news.latest}}}
    <p class="empty" data-empty="news-latest" hidden>このカテゴリのお知らせはまだありません。</p>
    <p class="news-more"><a class="more" href="/news/">お知らせ一覧を見る</a></p>
  </div>
</section>
