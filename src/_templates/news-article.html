    <div class="meta"><time datetime="{{article.date}}">{{article.dateLabel}}</time>{{{article.updated}}}{{{article.tag}}}</div>
    <h1 class="article-title">{{article.title}}</h1>
    <div class="article-body">
{{{article.body}}}

  </div>
</article>
