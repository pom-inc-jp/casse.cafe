# =================================================================
# casse.cafe の書き出しと公開
#
# - main に変更が入ると書き出し、Xserver の公開フォルダへ反映する
# - 毎日1回も書き出し直す（お知らせの「NEW」を日付で外すため）
# - 公開フォルダにある次のフォルダ・ファイルは消さない・上書きしない
#     ・casse_movie_app/ など名前が _movie_app で終わるフォルダ、casse_app/、movie/、movie_app/
#       （店内iPadの動画など。フォルダの中身もすべてそのまま）
#     ・反映の直前にサーバーを調べ、mp4 が入っているフォルダはすべて
#     ・.well-known/（SSL証明書の更新に使う）
#     ・wp-content/uploads/（旧サイトの画像。外部からのリンクのため。中のPDFは .htaccess で /menu/ へ転送）
#     ・google*.html、BingSiteAuth.xml（Search Console などの確認ファイル）
#
# 安全のための切り替え
#   リポジトリの変数（Settings → Secrets and variables → Actions → Variables）
#   CASSE_LIVE が true になるまでは、反映せず「試し（dry-run）」だけを行い、
#   残すフォルダと消えるファイルの一覧を実行結果のページに表示する。
#   手動実行（Actions → 公開 → Run workflow）で mode を deploy にすると、その1回だけ反映する。
# =================================================================
name: 公開

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 18 * * *'   # 毎日 3:10（日本時間）
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run＝一覧を見るだけ／deploy＝反映する'
        type: choice
        options: [dry-run, deploy]
        default: dry-run

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 書き出し
        run: node build.mjs

      - name: 公開先の設定があるか確認
        id: check
        env:
          XSERVER_HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          if [ -z "$XSERVER_HOST" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "公開先（XSERVER_HOST など）が未設定のため、書き出しだけで終了します" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH の準備
        if: steps.check.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.XSERVER_SSH_KEY }}
          HOST: ${{ secrets.XSERVER_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 10022 "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 残すフォルダを調べる（mp4 が入っているフォルダ＋固定のもの）
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_: ${{ secrets.XSERVER_USER }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          set -o pipefail
          # 公開フォルダ直下で、mp4 を含むフォルダ（直下に mp4 がある場合はそのファイル）を洗い出す
          ssh -i ~/.ssh/deploy_key -p 10022 "$USER_@$HOST" \
            "cd '$DEST' && find . -type f -iname '*.mp4' -printf '%P\n'" \
            | awk -F/ '{ if (NF>1) print "/" $1 "/"; else print "/" $1 }' | sort -u > keep.txt
          printf '/casse_app/\n/movie/\n/movie_app/\n*_movie_app/\n/.well-known/\n/wp-content/uploads/\n/google*.html\n/BingSiteAuth.xml\n' >> keep.txt
          echo '--- 残すフォルダ ---'; cat keep.txt
          sort -u keep.txt -o keep.txt
          {
            echo "## 残すフォルダ・ファイル（消さない・上書きしない）"
            echo '```'; cat keep.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 試し（dry-run）：変わるファイルと消えるファイルの一覧
        if: steps.check.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_: ${{ secrets.XSERVER_USER }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          rsync -az --delete --dry-run --itemize-changes --exclude-from=keep.txt \
            -e "ssh -i ~/.ssh/deploy_key -p 10022" dist/ "$USER_@$HOST:$DEST" > plan.txt
          deleted=$(grep -c '^\*deleting' plan.txt || true)
          {
            echo "## 消えるファイル（${deleted}件）"
            echo '```'; grep '^\*deleting' plan.txt | sed 's/^\*deleting *//' | head -n 500; echo '```'
            echo "## 追加・更新されるファイル"
            echo '```'; grep -v '^\*deleting' plan.txt | awk '{print $2}' | head -n 300; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat plan.txt

      - name: 反映
        if: >-
          steps.check.outputs.ready == 'true' && (
            (github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy') ||
            (github.event_name != 'workflow_dispatch' && vars.CASSE_LIVE == 'true')
          )
        env:
          HOST: ${{ secrets.XSERVER_HOST }}
          USER_: ${{ secrets.XSERVER_USER }}
          DEST: ${{ secrets.XSERVER_PATH }}
        run: |
          rsync -avz --delete --exclude-from=keep.txt \
            -e "ssh -i ~/.ssh/deploy_key -p 10022" dist/ "$USER_@$HOST:$DEST"
          echo "## 反映しました" >> "$GITHUB_STEP_SUMMARY"
